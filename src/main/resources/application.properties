# ========================================
# CONFIGURACOES DA APLICACAO
# ========================================

# Nome da aplicacao
spring.application.name=doceria-api

# ========================================
# CONFIGURACOES DO BANCO DE DADOS
# ========================================

spring.datasource.url=jdbc:mysql://localhost:3306/doceria_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / HIBERNATE
# ========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ========================================
# FLYWAY - MIGRACOES
# ========================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ========================================
# LOGGING
# ========================================

logging.level.com.doceria=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# CORS
# ========================================

doceria.cors.allowed-origins=http://localhost:5173,http://localhost:3000
doceria.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
doceria.cors.allowed-headers=*
doceria.cors.allow-credentials=true

# ========================================
# SWAGGER
# ========================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.packages-to-scan=com.doceria.controller